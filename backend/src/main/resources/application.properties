spring.config.import=optional:file:backend/.env[.properties],optional:file:.env[.properties]

app.cors.allowed-origin=http://localhost:5173

# Set OPENROUTER_API_KEY in backend/.env
openrouter.api-key=${OPENROUTER_API_KEY:${GEMINI_API_KEY:}}
openrouter.model=google/gemini-3.8-flash
openrouter.base-url=https://openrouter.ai
openrouter.max-tokens=2000

server.port=8080
